# Ollama Uncapped Context & Optimization Configuration
# Removes arbitrary token and context ceilings

ollama_server:
  host: "http://127.0.0.1:11434"
  timeout_seconds: 7200
  keep_alive: "24h"

context_tuning:
  num_ctx: 131072          # Full 128k context window
  num_predict: -1          # No limit on output token count
  num_thread: 8            # CPU threads
  temperature: 0.2
  top_k: 40
  top_p: 0.95
  repeat_penalty: 1.05
  stop:
    - "<|im_end|>"
    - "<|endoftext|>"

modelfile_templates:
  bonsai_uncapped: |
    FROM prism-ml/Bonsai-27B-gguf
    SYSTEM "You are an expert autonomous software engineer working directly in a project workspace. You inspect all existing files, refine existing implementations, and create modular, robust code. You never create single placeholder files like opmint.py or output.py."
    PARAMETER num_ctx 131072
    PARAMETER num_predict -1
    PARAMETER temperature 0.2
    PARAMETER top_p 0.95

  qwen_uncapped: |
    FROM qwen2.5:7b
    SYSTEM "You are an architectural planner and workspace coordinator. You plan multi-stage execution checklists in TODO.md with [ ] checkboxes and track execution."
    PARAMETER num_ctx 131072
    PARAMETER num_predict -1
    PARAMETER temperature 0.3
