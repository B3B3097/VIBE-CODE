name: VIBE-CODE Create PR

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '🔢 Run ID из generate.yml (из URL вкладки Actions)'
        required: true
        default: ''
      target_repo:
        description: '📦 Целевой репозиторий для PR (owner/repo)'
        required: true
        default: ''
      base_branch:
        description: '🌿 Базовая ветка в целевом репозитории'
        required: true
        default: 'main'
      branch_name:
        description: '✏️ Имя новой ветки (пусто = авто-генерация)'
        default: ''
      pr_title:
        description: '📝 Заголовок PR (пусто = авто из промпта)'
        default: ''
      pr_description:
        description: '💬 Дополнительное описание PR (опционально)'
        default: ''
      add_labels:
        description: '🏷️ Добавить labels к PR'
        default: 'true'
        type: choice
        options: ['true', 'false']
      draft:
        description: '📋 Создать PR как Draft'
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  actions: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:

      # ══════════════════════════════════════════════════════════════════════
      # 1. VALIDATE INPUTS
      # ══════════════════════════════════════════════════════════════════════
      - name: Validate inputs
        id: validate
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║           VIBE-CODE v3 — Create PR                      ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          
          ERRORS=0
          
          if [ -z "${{ inputs.run_id }}" ]; then
            echo "❌ ERROR: run_id is required"
            echo "   Найдите его в URL: https://github.com/OWNER/REPO/actions/runs/<run_id>"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ -z "${{ inputs.target_repo }}" ]; then
            echo "❌ ERROR: target_repo is required (формат: owner/repo)"
            ERRORS=$((ERRORS + 1))
          fi
          
          # Validate target_repo format
          if ! echo "${{ inputs.target_repo }}" | grep -qE '^[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+$'; then
            echo "❌ ERROR: target_repo должен быть в формате owner/repo"
            echo "   Получено: ${{ inputs.target_repo }}"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "❌ Found $ERRORS error(s) in inputs"
            exit 1
          fi
          
          echo "✅ Inputs valid:"
          echo "   Run ID:        ${{ inputs.run_id }}"
          echo "   Target repo:   ${{ inputs.target_repo }}"
          echo "   Base branch:   ${{ inputs.base_branch }}"
          echo "   Branch name:   ${{ inputs.branch_name || '(auto)' }}"
          echo "   PR title:      ${{ inputs.pr_title || '(auto)' }}"
          echo "   Add labels:    ${{ inputs.add_labels }}"
          echo "   Draft:         ${{ inputs.draft }}"
          
          # Generate branch name if not provided
          if [ -z "${{ inputs.branch_name }}" ]; then
            BRANCH="vibe-code/run-${{ inputs.run_id }}-$(date +%Y%m%d-%H%M%S)"
          else
            BRANCH="${{ inputs.branch_name }}"
          fi
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo ""
          echo "🌿 Branch to create: $BRANCH"

      # ══════════════════════════════════════════════════════════════════════
      # 2. CHECKOUT VIBE-CODE (for local results fallback)
      # ══════════════════════════════════════════════════════════════════════
      - name: Checkout VIBE-CODE
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ══════════════════════════════════════════════════════════════════════
      # 3. RESOLVE GITHUB TOKEN
      # ══════════════════════════════════════════════════════════════════════
      - name: Resolve GitHub token
        id: resolve-token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "token=$GH_PAT" >> "$GITHUB_OUTPUT"
            echo "source=GH_PAT" >> "$GITHUB_OUTPUT"
            echo "🔑 Using GH_PAT (personal access token)"
            echo "   ✅ Can create PRs in external repositories"
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "source=GITHUB_TOKEN" >> "$GITHUB_OUTPUT"
            echo "⚠️  Using default GITHUB_TOKEN"
            echo "   ❌ Cannot create PRs in external repositories"
            echo "   💡 Add GH_PAT secret: Settings → Secrets → Actions"
          fi

      # ══════════════════════════════════════════════════════════════════════
      # 4. VERIFY TARGET REPO EXISTS
      # ══════════════════════════════════════════════════════════════════════
      - name: Verify target repo exists
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
        run: |
          echo "🔍 Checking if ${{ inputs.target_repo }} exists..."
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.target_repo }}")
          
          if [ "$RESPONSE" != "200" ]; then
            echo "❌ ERROR: Repository ${{ inputs.target_repo }} not found or not accessible"
            echo "   HTTP Status: $RESPONSE"
            echo ""
            echo "   Возможные причины:"
            echo "   - Репозиторий не существует"
            echo "   - GH_PAT не имеет доступа к этому репозиторию"
            echo "   - Репозиторий приватный, а токен без прав repo"
            exit 1
          fi
          
          echo "✅ Repository ${{ inputs.target_repo }} is accessible"
          
          # Check if base branch exists
          BRANCH_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.target_repo }}/branches/${{ inputs.base_branch }}")
          
          if [ "$BRANCH_RESPONSE" != "200" ]; then
            echo "❌ ERROR: Branch '${{ inputs.base_branch }}' not found in ${{ inputs.target_repo }}"
            echo "   HTTP Status: $BRANCH_RESPONSE"
            echo ""
            echo "   Доступные ветки:"
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ inputs.target_repo }}/branches?per_page=10" | \
              python3 -c "import json,sys; [print(f'   - {b[\"name\"]}') for b in json.load(sys.stdin)]" 2>/dev/null
            exit 1
          fi
          
          echo "✅ Branch '${{ inputs.base_branch }}' exists"

      # ══════════════════════════════════════════════════════════════════════
      # 5. DOWNLOAD ARTIFACT FROM RUN
      # ══════════════════════════════════════════════════════════════════════
      - name: Download artifact from run
        id: download-artifact
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          echo "📦 Fetching artifacts for run $RUN_ID..."
          
          # Get artifacts list
          ARTIFACTS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts")
          
          # Check if request was successful
          if echo "$ARTIFACTS" | grep -q '"message"'; then
            echo "❌ ERROR: Failed to fetch artifacts"
            echo "$ARTIFACTS" | python3 -m json.tool
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Find vibe-output artifact
          ARTIFACT_ID=$(echo "$ARTIFACTS" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for a in data.get('artifacts', []):
                  if a['name'].startswith('vibe-output-'):
                      print(a['id'])
                      break
          except Exception:
              pass
          " 2>/dev/null)
          
          if [ -z "$ARTIFACT_ID" ]; then
            echo "⚠️  No vibe-output artifact found via API"
            echo ""
            echo "Available artifacts:"
            echo "$ARTIFACTS" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for a in data.get('artifacts', []):
                  print(f\"   - {a['name']} (ID: {a['id']}, Size: {a['size_in_bytes']} bytes)\")
          except Exception:
              print('   (none)')
          " 2>/dev/null
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "✅ Found artifact ID: $ARTIFACT_ID"
          
          # Download artifact with retry
          MAX_RETRIES=3
          RETRY=0
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "⬇️  Download attempt $((RETRY + 1))/$MAX_RETRIES..."
            curl -L -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
                 -o /tmp/artifact.zip
            
            if [ -f /tmp/artifact.zip ] && [ -s /tmp/artifact.zip ]; then
              echo "✅ Download successful: $(ls -la /tmp/artifact.zip)"
              break
            fi
            
            RETRY=$((RETRY + 1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "⏳ Waiting 5 seconds before retry..."
              sleep 5
            fi
          done
          
          if [ ! -f /tmp/artifact.zip ] || [ ! -s /tmp/artifact.zip ]; then
            echo "❌ Failed to download artifact after $MAX_RETRIES attempts"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Extract
          mkdir -p /tmp/artifact
          unzip -q /tmp/artifact.zip -d /tmp/artifact
          
          echo ""
          echo "═══ Artifact contents ═══"
          find /tmp/artifact -type f | head -20
          echo ""
          echo "found=true" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # 6. FALLBACK: LOCAL RESULTS FOLDER
      # ══════════════════════════════════════════════════════════════════════
      - name: Try fallback - local results folder
        if: steps.download-artifact.outputs.found != 'true'
        run: |
          FOLDER="results/run-${{ inputs.run_id }}"
          echo "📂 Trying local folder: $FOLDER"
          
          if [ ! -d "$FOLDER" ]; then
            echo "❌ ERROR: Neither artifact nor local results folder found for run ${{ inputs.run_id }}"
            echo ""
            echo "Available results folders:"
            ls -d results/run-* 2>/dev/null || echo "(none)"
            echo ""
            echo "💡 Проверьте:"
            echo "   1. Run ID правильный"
            echo "   2. generate.yml завершился успешно"
            echo "   3. Артефакты не удалены (хранятся 30 дней)"
            exit 1
          fi
          
          mkdir -p /tmp/artifact
          cp -r "$FOLDER"/* /tmp/artifact/ 2>/dev/null || true
          echo "✅ Using local results folder"
          echo ""
          echo "═══ Local folder contents ═══"
          find /tmp/artifact -type f | head -20

      # ══════════════════════════════════════════════════════════════════════
      # 7. PREPARE FILES FOR PR
      # ══════════════════════════════════════════════════════════════════════
      - name: Prepare files for PR
        run: |
          echo "📋 Preparing files for PR..."
          
          mkdir -p /tmp/pr_files
          cp -r /tmp/artifact/* /tmp/pr_files/ 2>/dev/null || true
          
          # If there's a nested ZIP, extract it
          ZIP_FILE=$(find /tmp/pr_files -name "*.zip" -type f | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 Found nested ZIP: $ZIP_FILE — extracting"
            unzip -q -o "$ZIP_FILE" -d /tmp/pr_files
            rm -f "$ZIP_FILE"
            
            # Flatten if there's a vibe_output subfolder
            INNER=$(find /tmp/pr_files -maxdepth 1 -type d -name "vibe_output" | head -1)
            if [ -n "$INNER" ]; then
              echo "📁 Flattening vibe_output subfolder"
              mv "$INNER"/* /tmp/pr_files/ 2>/dev/null || true
              rmdir "$INNER" 2>/dev/null || true
            fi
          fi
          
          # Remove metadata files (should not go into target repo)
          rm -f /tmp/pr_files/_*.json /tmp/pr_files/_*.md /tmp/pr_files/_*.txt 2>/dev/null || true
          rm -f /tmp/pr_files/vibe-output.zip 2>/dev/null || true
          
          echo ""
          echo "═══ Files to commit ═══"
          TOTAL_SIZE=0
          FILE_COUNT=0
          while IFS= read -r f; do
            SIZE=$(wc -c < "$f")
            TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
            FILE_COUNT=$((FILE_COUNT + 1))
            echo "  📄 $f ($SIZE bytes)"
          done < <(find /tmp/pr_files -type f)
          
          echo ""
          echo "Total: $FILE_COUNT file(s), $TOTAL_SIZE bytes"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No files to commit!"
            exit 1
          fi
          
          # Save file count for later use
          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      # ══════════════════════════════════════════════════════════════════════
      # 8. CLONE TARGET REPO AND CREATE BRANCH
      # ══════════════════════════════════════════════════════════════════════
      - name: Clone target repo and create branch
        id: clone
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.validate.outputs.branch_name }}
        run: |
          echo "🔧 Cloning $TARGET_REPO..."
          git clone --depth 1 -b "$BASE_BRANCH" \
            "https://x-access-token:$GH_TOKEN@github.com/$TARGET_REPO.git" /tmp/target
          
          cd /tmp/target
          
          echo "🌿 Creating branch: $BRANCH"
          git checkout -b "$BRANCH"
          
          # Configure git
          git config user.name "VIBE-CODE Bot"
          git config user.email "vibecode-bot@users.noreply.github.com"
          
          echo "✅ Branch created: $BRANCH"
          echo ""
          echo "═══ Repo info ═══"
          echo "  Remote: $(git remote -v | head -1)"
          echo "  Branch: $(git branch --show-current)"
          echo "  Files:  $(find . -type f -not -path './.git/*' | wc -l)"

      # ══════════════════════════════════════════════════════════════════════
      # 9. COPY GENERATED FILES TO TARGET REPO
      # ══════════════════════════════════════════════════════════════════════
      - name: Copy generated files to target repo
        run: |
          echo "📋 Copying files to target repo..."
          echo ""
          
          cd /tmp/target
          
          COPIED=0
          while IFS= read -r f; do
            rel="${f#/tmp/pr_files/}"
            rel="${rel#vibe_output/}"
            
            target="/tmp/target/$rel"
            mkdir -p "$(dirname "$target")"
            cp "$f" "$target"
            echo "  ✅ $rel"
            COPIED=$((COPIED + 1))
          done < <(find /tmp/pr_files -maxdepth 5 -type f ! -name '_*')
          
          echo ""
          echo "═══ Changes in target repo ═══"
          git status --short
          echo ""
          echo "Total files copied: $COPIED"

      # ══════════════════════════════════════════════════════════════════════
      # 10. COMMIT AND PUSH
      # ══════════════════════════════════════════════════════════════════════
      - name: Commit and push
        id: commit
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          BRANCH: ${{ steps.validate.outputs.branch_name }}
        run: |
          cd /tmp/target
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "⚠️  No changes to commit — files are identical to base branch"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Extract prompt from run summary
          PROMPT=""
          if [ -f /tmp/artifact/_run_summary.md ]; then
            PROMPT=$(grep -i "Prompt" /tmp/artifact/_run_summary.md | head -1 | cut -d'|' -f3 | xargs || echo "")
          fi
          if [ -z "$PROMPT" ]; then
            PROMPT="VIBE-CODE generated"
          fi
          
          # Build detailed commit message
          cat > /tmp/commit_msg.txt << EOF
          feat(vibe): $PROMPT

          Generated by VIBE-CODE v3 multi-agent platform

          Source run: ${{ inputs.run_id }}
          Source URL: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}
          Generated at: $(date -u +"%Y-%m-%d %H:%M UTC")
          Files changed: $(git diff --staged --name-only | wc -l)
          EOF
          
          git commit -F /tmp/commit_msg.txt
          git push origin "$BRANCH"
          
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "✅ Committed and pushed to $BRANCH"
          echo ""
          echo "═══ Commit info ═══"
          git log -1 --oneline

      # ══════════════════════════════════════════════════════════════════════
      # 11. CHECK IF PR ALREADY EXISTS
      # ══════════════════════════════════════════════════════════════════════
      - name: Check if PR already exists
        id: check-pr
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BRANCH: ${{ steps.validate.outputs.branch_name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          echo "🔍 Checking for existing PR from $BRANCH to $BASE_BRANCH..."
          
          EXISTING_PR=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/pulls?head=${{ github.repository_owner }}:$BRANCH&base=$BASE_BRANCH" | \
            python3 -c "
          import json, sys
          try:
              prs = json.load(sys.stdin)
              if prs:
                  print(prs[0].get('html_url', ''))
              else:
                  print('')
          except Exception:
              print('')
          " 2>/dev/null)
          
          if [ -n "$EXISTING_PR" ]; then
            echo "⚠️  PR already exists: $EXISTING_PR"
            echo "pr_exists=true" >> "$GITHUB_OUTPUT"
            echo "pr_url=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No existing PR found — will create new one"
            echo "pr_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # ══════════════════════════════════════════════════════════════════════
      # 12. CREATE PULL REQUEST
      # ══════════════════════════════════════════════════════════════════════
      - name: Create Pull Request
        id: pr
        if: steps.commit.outputs.has_changes == 'true' && steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.validate.outputs.branch_name }}
        run: |
          # Extract prompt from run summary
          PROMPT=""
          if [ -f /tmp/artifact/_run_summary.md ]; then
            PROMPT=$(grep -i "Prompt" /tmp/artifact/_run_summary.md | head -1 | cut -d'|' -f3 | xargs || echo "")
          fi
          if [ -z "$PROMPT" ]; then
            PROMPT="VIBE-CODE generated"
          fi
          
          # Determine PR title
          if [ -n "${{ inputs.pr_title }}" ]; then
            PR_TITLE="${{ inputs.pr_title }}"
          else
            PR_TITLE="feat(vibe): $PROMPT"
          fi
          # Truncate to 72 chars
          PR_TITLE=$(echo "$PR_TITLE" | head -c 72)
          
          # Build PR body
          cat > /tmp/pr_body.md << EOF
          ## 🤖 Generated by VIBE-CODE

          ### 📋 Описание задачи
          $PROMPT

          ${{ inputs.pr_description }}

          ### 📊 Детали генерации
          | Параметр | Значение |
          |----------|----------|
          | **Run ID** | [${{ inputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}) |
          | **Целевой репозиторий** | \`$TARGET_REPO\` |
          | **Базовая ветка** | \`$BASE_BRANCH\` |
          | **Сгенерировано** | $(date -u +"%Y-%m-%d %H:%M UTC") |
          | **Файлов изменено** | $(cd /tmp/target && git diff --staged --name-only 2>/dev/null | wc -l || echo "?") |

          ### 📁 Изменённые файлы
          $(cd /tmp/target && git diff HEAD~1 --name-only 2>/dev/null | sed 's/^/- `/' | sed 's/$/`/' || echo "- (unable to list)")

          ---
          _Этот PR был создан автоматически платформой VIBE-CODE v3._
          _Для вопросов смотрите [исходный run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.run_id }})._
          EOF
          
          # Create PR via GitHub API
          PR_DATA=$(python3 -c "
          import json
          with open('/tmp/pr_body.md') as f:
              body = f.read()
          data = {
              'title': '''$PR_TITLE''',
              'body': body,
              'head': '$BRANCH',
              'base': '$BASE_BRANCH',
              'draft': ${{ inputs.draft == 'true' && 'True' || 'False' }}
          }
          print(json.dumps(data))
          ")
          
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/pulls" \
            -d "$PR_DATA")
          
          PR_URL=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              if 'html_url' in d:
                  print(d['html_url'])
              else:
                  print('ERROR: ' + d.get('message', 'unknown error'))
          except Exception as e:
              print(f'ERROR: {e}')
          " 2>/dev/null)
          
          echo "PR URL: $PR_URL"
          
          if [[ "$PR_URL" == ERROR* ]]; then
            echo "❌ Failed to create PR: $PR_URL"
            echo ""
            echo "Response:"
            echo "$RESPONSE" | python3 -m json.tool 2>/dev/null || echo "$RESPONSE"
            echo ""
            echo "💡 Возможные причины:"
            echo "   - GH_PAT не имеет прав на создание PR в $TARGET_REPO"
            echo "   - Ветка $BRANCH уже существует в target repo"
            echo "   - Репозиторий имеет ограничения на создание PR"
            exit 1
          fi
          
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "✅ PR created: $PR_URL"

      # ══════════════════════════════════════════════════════════════════════
      # 13. ADD LABELS TO PR
      # ══════════════════════════════════════════════════════════════════════
      - name: Add labels to PR
        if: steps.commit.outputs.has_changes == 'true' && inputs.add_labels == 'true' && steps.check-pr.outputs.pr_exists != 'true'
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          if [ -z "$PR_URL" ]; then
            echo "⚠️  No PR URL available, skipping labels"
            exit 0
          fi
          
          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          
          echo "🏷️  Adding labels to PR #$PR_NUMBER..."
          
          # Create labels if they don't exist
          for LABEL in "vibe-code" "automated"; do
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$TARGET_REPO/labels" \
              -d "{\"name\": \"$LABEL\", \"color\": \"7B68EE\", \"description\": \"Created by VIBE-CODE\"}" \
              > /dev/null 2>&1 || true
          done
          
          # Add labels to PR
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$TARGET_REPO/issues/$PR_NUMBER/labels" \
            -d '{"labels": ["vibe-code", "automated"]}')
          
          if echo "$RESPONSE" | grep -q '"name"'; then
            echo "✅ Labels added: vibe-code, automated"
          else
            echo "⚠️  Failed to add labels (may need write permissions)"
          fi

      # ══════════════════════════════════════════════════════════════════════
      # 14. SUMMARY
      # ══════════════════════════════════════════════════════════════════════
      - name: Summary
        if: always()
        run: |
          echo "## 🎯 VIBE-CODE Create PR — Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Параметр | Значение |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | \`${{ inputs.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Целевой репозиторий** | \`${{ inputs.target_repo }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Базовая ветка** | \`${{ inputs.base_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Новая ветка** | \`${{ steps.validate.outputs.branch_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Есть изменения** | ${{ steps.commit.outputs.has_changes || 'unknown' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Draft PR** | ${{ inputs.draft }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Labels** | ${{ inputs.add_labels }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            echo "### ✅ PR создан успешно!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**🔗 [Открыть PR →](${{ steps.pr.outputs.pr_url }})**" >> $GITHUB_STEP_SUMMARY
          elif [ -n "${{ steps.check-pr.outputs.pr_url }}" ]; then
            echo "### ⚠️ PR уже существует" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**🔗 [Открыть существующий PR →](${{ steps.check-pr.outputs.pr_url }})**" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ PR не был создан" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Проверьте логи выше для деталей." >> $GITHUB_STEP_SUMMARY
          fi