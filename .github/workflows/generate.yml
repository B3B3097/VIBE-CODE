name: VIBE-CODE Generate + Storage

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What to build / fix / improve'
        required: true
        default: ''
      file_name:
        description: 'Output filename (e.g. main.py)'
        default: 'output.py'
      mode:
        description: 'generate | improve'
        default: 'generate'
        type: choice
        options: [generate, improve]
      agent_mode:
        description: 'Agent mode: single | multi'
        default: 'single'
        type: choice
        options: [single, multi]
      enable_tools:
        description: 'Enable internet API tools (ToolRouter)'
        default: 'true'
        type: choice
        options: ['true', 'false']
      target_repo:
        description: 'Repo to read context from (owner/repo, empty = skip)'
        default: ''
      model_planner:
        description: 'Planner model (multi-agent)'
        default: 'qwen2.5:7b'
      model_coder:
        description: 'Coder model (multi-agent)'
        default: 'bonsai-27b'
      model_single:
        description: 'Single-agent model'
        default: 'qwen2.5-coder:7b'
      max_tokens:
        description: 'Max tokens per model call'
        default: '4096'
      iterations:
        description: 'Iterations (single-agent)'
        default: '1'
      total_budget:
        description: 'Total token budget (0 = unlimited)'
        default: '0'
      uncensored:
        description: 'Uncensored mode (no content refusals + security audit)'
        default: 'false'
        type: choice
        options: ['false', 'true']
      auto_pr:
        description: 'Auto-create pull request (deprecated — use pr.yaml)'
        default: 'false'
        type: choice
        options: ['false', 'true']
      auto_notes:
        description: 'Generate release notes'
        default: 'true'
        type: choice
        options: ['false', 'true']
      storage_repo:
        description: 'Private repo with chats & keys'
        default: 'B3B3097/Storage-VIBE-CODE'

permissions:
  contents: write
  actions: read

env:
  OLLAMA_HOST: http://127.0.0.1:11434
  OUTPUT_DIR: /tmp/vibe_output
  STORAGE_DIR: /tmp/storage

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── Checkout VIBE-CODE ─────────────────────────────────────────────────
      - name: Checkout VIBE-CODE
        uses: actions/checkout@v5

      # ── Resolve GitHub token: GH → GH_PAT → GITHUB_TOKEN ──────────────────
      - name: Resolve GitHub token
        id: token
        env:
          GH: ${{ secrets.GH }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH" ]; then
            echo "token=$GH" >> "$GITHUB_OUTPUT"
            echo "🔑 Using GH"
          elif [ -n "$GH_PAT" ]; then
            echo "token=$GH_PAT" >> "$GITHUB_OUTPUT"
            echo "🔑 Using GH_PAT"
          else
            echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "🔑 Using GITHUB_TOKEN"
          fi

      # ── Pull storage repo (chats + keys from private repo) ────────────────
      - name: Pull storage repo
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: |
          mkdir -p "$STORAGE_DIR"
          python3 sync_storage.py pull && echo "✅ Storage pulled" \
            || echo "⚠️ Storage pull failed — continuing without it"

      # ── Load keys from storage into GITHUB_ENV (NEVER committed to git) ───
      - name: Load keys from storage
        run: |
          LOADED=0
          for f in "$STORAGE_DIR/keys/secrets.env" "$STORAGE_DIR/secrets.env"; do
            [ -f "$f" ] || continue
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ""|"#"*) continue ;;
                *=*)
                  echo "$line" >> "$GITHUB_ENV"
                  LOADED=$((LOADED + 1))
                  ;;
              esac
            done < "$f"
          done
          echo "✅ Loaded $LOADED keys from storage"

      # ── Install Ollama ────────────────────────────────────────────────────
      - name: Install Ollama
        run: |
          echo "⬇️ Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          
          echo "🚀 Starting Ollama server..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          
          echo "⏳ Waiting for Ollama to be ready..."
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready after ~$((i * 2)) seconds"
              break
            fi
            sleep 2
          done
          
          if ! curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
            echo "❌ Ollama failed to start after 180 seconds!"
            tail -n 30 /tmp/ollama.log
            exit 1
          fi

      # ── Cache models ──────────────────────────────────────────────────────
      - name: Restore model cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ~/.ollama
          key: ollama-${{ inputs.agent_mode }}-${{ inputs.model_single }}-${{ inputs.model_planner }}-v2
          restore-keys: |
            ollama-${{ inputs.agent_mode }}-${{ inputs.model_single }}-

      # ── Pull models (single or multi-agent) ───────────────────────────────
      - name: Pull models
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ "${{ inputs.agent_mode }}" = "multi" ]; then
            echo "⬇️ Pulling planner: ${{ inputs.model_planner }}"
            ollama pull ${{ inputs.model_planner }}
            
            if [ "${{ inputs.model_coder }}" = "bonsai-27b" ]; then
              echo "⬇️ Downloading Bonsai 27B GGUF..."
              pip install -q huggingface_hub
              mkdir -p /tmp/bonsai-gguf
              python3 -c "
              from huggingface_hub import hf_hub_download
              path = hf_hub_download(
                  repo_id='prism-ml/Bonsai-27B-gguf',
                  filename='Bonsai-27B-Q1_0.gguf',
                  local_dir='/tmp/bonsai-gguf'
              )
              print(f'Downloaded: {path}')
              "
              printf 'FROM /tmp/bonsai-gguf/Bonsai-27B-Q1_0.gguf\nSYSTEM "You are an expert software engineer."\nPARAMETER temperature 0.2\nPARAMETER top_p 0.9\nPARAMETER num_predict 4096\n' > /tmp/bonsai-modelfile
              ollama create bonsai-27b -f /tmp/bonsai-modelfile
              echo "✅ bonsai-27b registered"
            else
              echo "⬇️ Pulling coder: ${{ inputs.model_coder }}"
              ollama pull ${{ inputs.model_coder }}
            fi
          else
            echo "⬇️ Pulling single-agent: ${{ inputs.model_single }}"
            ollama pull ${{ inputs.model_single }}
          fi

      # ── Fetch target repo context ─────────────────────────────────────────
      - name: Fetch target repo context
        if: inputs.target_repo != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "📂 Reading repo context: ${{ inputs.target_repo }}"
          python3 read_repo.py "${{ inputs.target_repo }}" "$GH_TOKEN" 60000 > /tmp/repo_ctx_raw.txt 2>&1 || true
          if [ -f /tmp/repo_context.b64 ]; then
            SIZE=$(wc -c < /tmp/repo_context.b64)
            echo "✅ Context saved: $SIZE bytes"
          else
            echo "⚠️ No context was generated"
          fi

      # ── Run VIBE-CODE ─────────────────────────────────────────────────────
      - name: Run VIBE-CODE
        env:
          PROMPT: "${{ inputs.prompt }}"
          FILE_NAME: "${{ inputs.file_name }}"
          MODE: "${{ inputs.mode }}"
          AGENT_MODE: "${{ inputs.agent_mode }}"
          ENABLE_TOOLS: "${{ inputs.enable_tools }}"
          MODEL_PLANNER: "${{ inputs.model_planner }}"
          MODEL_CODER: "${{ inputs.model_coder }}"
          MODEL_SINGLE: "${{ inputs.model_single }}"
          MAX_TOKENS: "${{ inputs.max_tokens }}"
          ITERATIONS: "${{ inputs.iterations }}"
          TOTAL_BUDGET: "${{ inputs.total_budget }}"
          UNCENSORED: "${{ inputs.uncensored }}"
          AUTO_PR: "${{ inputs.auto_pr }}"
          AUTO_NOTES: "${{ inputs.auto_notes }}"
          TARGET_REPO: "${{ inputs.target_repo }}"
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_DIR: /tmp/storage
          STORAGE_REPO: ${{ inputs.storage_repo }}
          CHAT_ID: run-${{ github.run_id }}
        run: |
          mkdir -p /tmp/vibe_output
          echo "🚀 Starting VIBE-CODE..."
          python3 generate.py
          EXIT_CODE=$?
          echo "VIBE-CODE finished with exit code: $EXIT_CODE"
          exit $EXIT_CODE

      # ── Commit results to VIBE-CODE (code only, NO keys/chats) ────────────
      - name: Commit results to VIBE-CODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "feat(vibe): ${{ inputs.prompt }}"
        run: |
          git config user.name "VIBE-CODE Bot"
          git config user.email "vibecode-bot@users.noreply.github.com"
          
          FOLDER="results/run-${{ github.run_id }}"
          mkdir -p "$FOLDER"
          
          find /tmp/vibe_output -maxdepth 2 -type f ! -name '_*' -exec cp {} "$FOLDER/" \; 2>/dev/null || true
          
          for f in _release_notes.md _tools_status.json _progress.json _reasoning.json _budget_report.json; do
            cp "/tmp/vibe_output/$f" "$FOLDER/" 2>/dev/null || true
          done
          
          python3 -m pip install -q pyyaml || true
          python3 update_token_stats.py || echo "⚠️ Token stats update failed"
          
          git add "$FOLDER" token_usage.yaml README.md
          
          if git diff --staged --quiet; then
            echo "Nothing to commit — outputs folder is empty or unchanged"
          else
            echo "$COMMIT_MSG" > /tmp/commit_msg.txt
            git commit -F /tmp/commit_msg.txt
            git push
            echo "✅ Results committed to $FOLDER"
          fi

      # ── Push chats back to private storage repo ──────────────────────────
      - name: Push chats to storage
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: |
          python3 sync_storage.py push && echo "✅ Storage pushed" \
            || echo "⚠️ Storage push failed"

      # ── Upload output as artifact ─────────────────────────────────────────
      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vibe-output-${{ github.run_id }}
          path: /tmp/vibe_output/
          retention-days: 30

      # ── Print Ollama logs on failure ──────────────────────────────────────
      - name: Print Ollama logs on failure
        if: failure()
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                  OLLAMA ERROR LOGS                       ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          tail -50 /tmp/ollama.log 2>/dev/null || echo "(no logs)"