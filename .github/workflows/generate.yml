name: VIBE-CODE v2 — Multi-Agent Platform

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'What to build / fix / improve'
        required: true
        default: ''
      file_name:
        description: 'Output filename (e.g. main.py)'
        default: 'output.py'
      mode:
        description: 'generate | improve'
        default: 'generate'
        type: choice
        options: [generate, improve]
      agent_mode:
        description: 'Agent mode: single | multi'
        default: 'single'
        type: choice
        options: [single, multi]
      enable_tools:
        description: 'Enable internet API tools (ToolRouter)'
        default: 'true'
        type: choice
        options: ['true', 'false']
      target_repo:
        description: 'Target repo (owner/repo, empty = skip)'
        default: ''
      auto_pr:
        description: 'Create PR automatically'
        default: 'false'
        type: choice
        options: ['false', 'true']
      auto_notes:
        description: 'Generate release notes'
        default: 'true'
        type: choice
        options: ['true', 'false']
      model_planner:
        description: 'Planner model'
        default: 'qwen2.5:7b'
      model_coder:
        description: 'Coder model'
        default: 'bonsai-27b'
      model_single:
        description: 'Single-agent model'
        default: 'qwen2.5-coder:7b'
      max_tokens:
        description: 'Max tokens per model call'
        default: '4096'
      iterations:
        description: 'Iterations (single-agent)'
        default: '1'
      total_budget:
        description: 'Total token budget (0 = auto)'
        default: '0'
      uncensored:
        description: 'Uncensored mode (no content refusals + security audit)'
        default: 'false'
        type: choice
        options: ['false', 'true']
      # NOTE: All API keys are stored as GitHub repository secrets.
      # Go to Settings → Secrets → Actions to add them.
      # Supported secret names: SERPER_API_KEY, BRAVE_API_KEY, OPENAI_API_KEY,
      # ANTHROPIC_API_KEY, GROQ_API_KEY, TOGETHER_API_KEY, HF_API_KEY,
      # OPENWEATHER_API_KEY, NEWS_API_KEY, GNEWS_API_KEY, JUDGE0_API_KEY,
      # ALPHAVANTAGE_API_KEY, EXCHANGERATE_API_KEY, UNSPLASH_API_KEY,
      # PEXELS_API_KEY, STABILITY_API_KEY, ELEVENLABS_API_KEY,
      # TELEGRAM_BOT_TOKEN, DISCORD_WEBHOOK_URL, SLACK_WEBHOOK_URL,
      # MAILGUN_API_KEY, WOLFRAM_API_KEY, DEEPL_API_KEY, NOTION_API_KEY,
      # AIRTABLE_API_KEY, SUPABASE_API_KEY, BING_SEARCH_KEY,
      # COHERE_API_KEY, MISTRAL_API_KEY, REPLICATE_API_KEY,
      # TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, IPINFO_TOKEN,
      # MAPBOX_API_KEY, URLSCAN_API_KEY

permissions:
  contents: write
  pull-requests: write
  actions: write

env:
  OLLAMA_HOST: http://127.0.0.1:11434
  OUTPUT_DIR: /tmp/vibe_output

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout VIBE-CODE
        uses: actions/checkout@v4

      # ── System info ──────────────────────────────────────────────────────────
      - name: System info
        run: |
          echo "CPU : $(nproc) cores  $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
          echo "RAM : $(free -h | awk '/^Mem/{print $2}')"
          echo "Mode: ${{ inputs.agent_mode }}"
          echo "Tools: ${{ inputs.enable_tools }}"
          echo "Repo: ${{ inputs.target_repo }}"

      # ── Install Ollama ────────────────────────────────────────────────────────
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo "Waiting for Ollama…"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags > /dev/null 2>&1 && break
            sleep 2
          done
          echo "Ollama ready"

      # ── Single-agent model cache ──────────────────────────────────────────────
      - name: Restore single-agent model cache
        id: cache-single
        if: inputs.agent_mode == 'single'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ inputs.model_single }}-v1
          restore-keys: ollama-${{ inputs.model_single }}-

      - name: Pull single-agent model
        if: inputs.agent_mode == 'single' && steps.cache-single.outputs.cache-hit != 'true'
        run: ollama pull ${{ inputs.model_single }}

      - name: Warm up single-agent model
        if: inputs.agent_mode == 'single' && steps.cache-single.outputs.cache-hit == 'true'
        run: echo "hi" | timeout 60 ollama run ${{ inputs.model_single }} || true

      # ── Planner model cache (multi-agent) ─────────────────────────────────────
      - name: Restore planner model cache
        id: cache-planner
        if: inputs.agent_mode == 'multi'
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-${{ inputs.model_planner }}-v1
          restore-keys: ollama-${{ inputs.model_planner }}-

      - name: Pull planner model
        if: inputs.agent_mode == 'multi' && steps.cache-planner.outputs.cache-hit != 'true'
        run: ollama pull ${{ inputs.model_planner }}

      # ── Bonsai 27B setup ─────────────────────────────────────────────────────
      - name: Restore Bonsai 27B GGUF cache
        id: cache-bonsai
        if: inputs.agent_mode == 'multi' && inputs.model_coder == 'bonsai-27b'
        uses: actions/cache@v4
        with:
          path: /tmp/bonsai-gguf
          key: bonsai-27b-q1-v1

      - name: Download Bonsai 27B GGUF
        if: inputs.agent_mode == 'multi' && inputs.model_coder == 'bonsai-27b' && steps.cache-bonsai.outputs.cache-hit != 'true'
        run: |
          pip install -q huggingface_hub
          mkdir -p /tmp/bonsai-gguf
          python3 -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='prism-ml/Bonsai-27B-gguf',
              filename='Bonsai-27B-Q1_0.gguf',
              local_dir='/tmp/bonsai-gguf'
          )
          print(f'Downloaded: {path}')
          "

      - name: Register Bonsai 27B in Ollama
        if: inputs.agent_mode == 'multi' && inputs.model_coder == 'bonsai-27b'
        run: |
          cat > /tmp/bonsai-modelfile << 'MODELEOF'
          FROM /tmp/bonsai-gguf/Bonsai-27B-Q1_0.gguf
          SYSTEM "You are an expert software engineer specializing in writing clean, production-ready code."
          PARAMETER temperature 0.2
          PARAMETER top_p 0.9
          PARAMETER num_predict 4096
          MODELEOF
          ollama create bonsai-27b -f /tmp/bonsai-modelfile
          ollama list

      - name: Pull generic coder model
        if: inputs.agent_mode == 'multi' && inputs.model_coder != 'bonsai-27b'
        run: ollama pull ${{ inputs.model_coder }}

      # ── Fetch target repo context ─────────────────────────────────────────────
      - name: Fetch target repo context
        if: inputs.target_repo != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Reading repo: ${{ inputs.target_repo }}"
          python3 read_repo.py "${{ inputs.target_repo }}" "$GH_TOKEN" 60000 > /tmp/repo_ctx_raw.txt 2>&1 || true
          [ -f /tmp/repo_context.b64 ] && echo "Context: $(wc -c < /tmp/repo_context.b64) bytes" || echo "No context"

      # ── Run VIBE-CODE ─────────────────────────────────────────────────────────
      - name: Run VIBE-CODE
        env:
          # ── Core inputs ──
          PROMPT:        "${{ inputs.prompt }}"
          FILE_NAME:     "${{ inputs.file_name }}"
          MODE:          "${{ inputs.mode }}"
          AGENT_MODE:    "${{ inputs.agent_mode }}"
          ENABLE_TOOLS:  "${{ inputs.enable_tools }}"
          TARGET_REPO:   "${{ inputs.target_repo }}"
          GH_TOKEN:      "${{ secrets.GITHUB_TOKEN }}"
          AUTO_PR:       "${{ inputs.auto_pr }}"
          AUTO_NOTES:    "${{ inputs.auto_notes }}"
          MODEL_PLANNER: "${{ inputs.model_planner }}"
          MODEL_CODER:   "${{ inputs.model_coder }}"
          MODEL_SINGLE:  "${{ inputs.model_single }}"
          MAX_TOKENS:    "${{ inputs.max_tokens }}"
          ITERATIONS:    "${{ inputs.iterations }}"
          TOTAL_BUDGET:  "${{ inputs.total_budget }}"
          UNCENSORED:    "${{ inputs.uncensored }}"
          OUTPUT_DIR:    "/tmp/vibe_output"
          # ── API keys from repository secrets ──
          # Add these under Settings → Secrets → Actions in your repo
          SERPER_API_KEY:        "${{ secrets.SERPER_API_KEY }}"
          BRAVE_API_KEY:         "${{ secrets.BRAVE_API_KEY }}"
          BING_SEARCH_KEY:       "${{ secrets.BING_SEARCH_KEY }}"
          OPENWEATHER_API_KEY:   "${{ secrets.OPENWEATHER_API_KEY }}"
          NEWS_API_KEY:          "${{ secrets.NEWS_API_KEY }}"
          GNEWS_API_KEY:         "${{ secrets.GNEWS_API_KEY }}"
          OPENAI_API_KEY:        "${{ secrets.OPENAI_API_KEY }}"
          ANTHROPIC_API_KEY:     "${{ secrets.ANTHROPIC_API_KEY }}"
          GROQ_API_KEY:          "${{ secrets.GROQ_API_KEY }}"
          TOGETHER_API_KEY:      "${{ secrets.TOGETHER_API_KEY }}"
          HF_API_KEY:            "${{ secrets.HF_API_KEY }}"
          COHERE_API_KEY:        "${{ secrets.COHERE_API_KEY }}"
          MISTRAL_API_KEY:       "${{ secrets.MISTRAL_API_KEY }}"
          REPLICATE_API_KEY:     "${{ secrets.REPLICATE_API_KEY }}"
          JUDGE0_API_KEY:        "${{ secrets.JUDGE0_API_KEY }}"
          ALPHAVANTAGE_API_KEY:  "${{ secrets.ALPHAVANTAGE_API_KEY }}"
          EXCHANGERATE_API_KEY:  "${{ secrets.EXCHANGERATE_API_KEY }}"
          UNSPLASH_API_KEY:      "${{ secrets.UNSPLASH_API_KEY }}"
          PEXELS_API_KEY:        "${{ secrets.PEXELS_API_KEY }}"
          STABILITY_API_KEY:     "${{ secrets.STABILITY_API_KEY }}"
          ELEVENLABS_API_KEY:    "${{ secrets.ELEVENLABS_API_KEY }}"
          TELEGRAM_BOT_TOKEN:    "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          DISCORD_WEBHOOK_URL:   "${{ secrets.DISCORD_WEBHOOK_URL }}"
          SLACK_WEBHOOK_URL:     "${{ secrets.SLACK_WEBHOOK_URL }}"
          MAILGUN_API_KEY:       "${{ secrets.MAILGUN_API_KEY }}"
          TWILIO_ACCOUNT_SID:    "${{ secrets.TWILIO_ACCOUNT_SID }}"
          TWILIO_AUTH_TOKEN:     "${{ secrets.TWILIO_AUTH_TOKEN }}"
          WOLFRAM_API_KEY:       "${{ secrets.WOLFRAM_API_KEY }}"
          DEEPL_API_KEY:         "${{ secrets.DEEPL_API_KEY }}"
          IPINFO_TOKEN:          "${{ secrets.IPINFO_TOKEN }}"
          MAPBOX_API_KEY:        "${{ secrets.MAPBOX_API_KEY }}"
          URLSCAN_API_KEY:       "${{ secrets.URLSCAN_API_KEY }}"
          NOTION_API_KEY:        "${{ secrets.NOTION_API_KEY }}"
          AIRTABLE_API_KEY:      "${{ secrets.AIRTABLE_API_KEY }}"
          SUPABASE_API_KEY:      "${{ secrets.SUPABASE_API_KEY }}"
        run: |
          mkdir -p /tmp/vibe_output
          python3 generate.py

      # ── Show results ──────────────────────────────────────────────────────────
      - name: Show generated files
        if: always()
        run: |
          echo "=== Output directory ==="
          ls -la /tmp/vibe_output/ 2>/dev/null || echo "empty"
          echo ""
          echo "=== Tools used ==="
          cat /tmp/vibe_output/_tools_status.json 2>/dev/null | python3 -c "
          import json,sys
          tools = json.load(sys.stdin)
          active = [t['name'] for t in tools if t.get('active')]
          print(f'Active ({len(active)}): {chr(44).join(active[:10])}...')
          " || echo "none"
          echo ""
          echo "=== Release notes ==="
          cat /tmp/vibe_output/_release_notes.md 2>/dev/null || echo "none"
          echo ""
          echo "=== PR URL ==="
          cat /tmp/vibe_output/_pr_url.txt 2>/dev/null || echo "none"

      # ── Commit results to this repo ───────────────────────────────────────────
      - name: Commit results to VIBE-CODE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "VIBE-CODE Bot"
          git config user.email "vibecode-bot@users.noreply.github.com"

          SLUG=$(echo "${{ inputs.prompt }}" | head -c 50 | tr ' /' '--' | tr -cd '[:alnum:]-')
          FOLDER="results/${SLUG}-$(date +%Y%m%d-%H%M%S)"
          mkdir -p "$FOLDER"

          find /tmp/vibe_output -maxdepth 2 -type f ! -name '_*' -exec cp {} "$FOLDER/" \; 2>/dev/null || true
          cp /tmp/vibe_output/_release_notes.md "$FOLDER/" 2>/dev/null || true
          cp /tmp/vibe_output/_pr_url.txt        "$FOLDER/" 2>/dev/null || true
          cp /tmp/vibe_output/_tools_status.json "$FOLDER/" 2>/dev/null || true

          cat > "$FOLDER/_run_summary.md" << SUMMARY
          # VIBE-CODE Run Summary

          | Field | Value |
          |-------|-------|
          | **Prompt** | ${{ inputs.prompt }} |
          | **Mode** | ${{ inputs.agent_mode }} |
          | **Tools** | ${{ inputs.enable_tools }} |
          | **Planner** | ${{ inputs.model_planner }} |
          | **Coder** | ${{ inputs.model_coder }} |
          | **Target Repo** | ${{ inputs.target_repo }} |
          | **Auto PR** | ${{ inputs.auto_pr }} |
          | **Timestamp** | $(date -u +"%Y-%m-%d %H:%M UTC") |
          SUMMARY

          git add "$FOLDER"
          if git diff --staged --quiet; then
            echo "Nothing to commit — outputs folder is empty or unchanged"
          else
            git commit -m "feat(vibe): ${{ inputs.prompt }}"
            git push
          fi

      # ── Upload artifact ───────────────────────────────────────────────────────
      - name: Upload output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibe-output-${{ github.run_id }}
          path: /tmp/vibe_output/
          retention-days: 7

      # ── Ollama logs on failure ────────────────────────────────────────────────
      - name: Print Ollama logs on failure
        if: failure()
        run: cat /tmp/ollama.log 2>/dev/null | tail -50
