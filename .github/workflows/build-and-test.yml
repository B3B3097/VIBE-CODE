name: Build and Test Web Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: |
        npm install

    - name: Build application
      run: |
        npm run build

    - name: Run tests
      run: |
        npm test
        id: analysis
        run: |
          echo "🧠 Thinking about project structure..."
          echo "Checking if package.json has build/test scripts..."
          test -f package.json && echo "✅ Found package.json" || exit 1

      - name: Run tests
        run: npm test -- --coverage

      - name: Generate coverage report
        run: nyc report --json > coverage.json

# Optional: PR creation step (requires permissions)
  create-pr-action:
    needs: build-and-test
    if: github.event_name == 'pull_request' && github.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create PR
        idname: CI/CD & Code Review Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
