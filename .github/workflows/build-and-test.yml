name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Python syntax
        run: |
          for f in *.py src/*.py scripts/*.py tests/*.py; do
            if [ -f "$f" ]; then
              python3 -m py_compile "$f" && echo "✅ $f syntax OK"
            fi
          done

      - name: Run unit test suite
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node & Express Server Syntax
        run: |
          node --check server.js && echo "✅ server.js syntax OK"

      - name: Verify Web Assets
        run: |
          test -f index.html && echo "✅ index.html present" || exit 1
          test -f admin_panel.html && echo "✅ admin_panel.html present" || exit 1

      - name: Show repo tree
        run: ls -la
