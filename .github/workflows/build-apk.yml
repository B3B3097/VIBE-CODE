name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'server.js'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version tag (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
      create_release:
        description: 'Create GitHub Release with APK'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Web Application into Android Assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/index.html
          if [ -f "admin_panel.html" ]; then
            cp admin_panel.html android/app/src/main/assets/www/admin_panel.html
          fi
          if [ -d "public" ]; then
            cp -r public android/app/src/main/assets/www/
          fi
          echo "✅ Web application assets packaged into Android assets."

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble Android APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage APK Artifacts
        id: stage_apk
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            TAG_VER="${{ github.ref_name }}"
            if [ -z "$TAG_VER" ] || [ "$TAG_VER" = "main" ]; then
              TAG_VER="${{ github.event.inputs.version_name || 'v2.0.0' }}"
            fi
            TARGET_NAME="VIBE-CODE-${TAG_VER}.apk"
            cp "$APK_PATH" "build-output/${TARGET_NAME}"
            echo "apk_path=build-output/${TARGET_NAME}" >> $GITHUB_OUTPUT
            echo "apk_name=${TARGET_NAME}" >> $GITHUB_OUTPUT
            echo "✅ Output APK prepared: build-output/${TARGET_NAME}"
          else
            echo "❌ No APK found in build outputs!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibe-code-apk
          path: build-output/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version_name || 'v2.0.0' }}
          name: "VIBE-CODE Android Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.version_name || 'v2.0.0' }}"
          body: |
            ## 📱 VIBE-CODE Mobile Application (Android APK)
            
            Autonomous Multi-Agent AI Code Generation Platform for Android.
            
            ### 🚀 Features in this build:
            - **Autonomous Workspace Engine**: Multi-file architecture, AST analysis, granular `TODO.md [x]` tasks.
            - **Interactive Model Thinking**: Live reasoning thoughts with countdown timer and collapsible thought trace.
            - **Uncapped Ollama Context**: Full 131,072 token context window enabled.
            - **Private Storage Integration**: Transcripts and repository artifacts backed up securely to `B3B3097/Storage-VIBE-CODE`.
            - **Native Mobile Support**: Offline-capable WebView with pull-to-refresh and local caching.
            
            ### 📥 Installation Instructions:
            1. Download the attached `.apk` file below to your Android device.
            2. In Android settings, enable **"Install unknown apps"** for your browser or file manager.
            3. Tap the downloaded file to install and enjoy VIBE-CODE on mobile!
          files: build-output/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
