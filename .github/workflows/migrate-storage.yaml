name: One-Time Migration → Storage (final)

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Old repo (source of chats)'
        default: 'B3B3097/VIBE-CODE'
      storage_repo:
        description: 'Private storage repo'
        default: 'B3B3097/Storage-VIBE-CODE'
      with_backup:
        description: 'Backup token_usage.yaml / config.yaml etc.'
        default: 'true'
        type: choice
        options: ['true', 'false']
      sanitize:
        description: 'Clean public repo after migration'
        default: 'true'
        type: choice
        options: ['true', 'false']
      force:
        description: 'Re-run even if marker exists'
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

env:
  STORAGE_DIR: /tmp/storage

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout VIBE-CODE
        uses: actions/checkout@v5

      - name: Resolve GitHub token
        id: token
        env:
          GH: ${{ secrets.GH }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH" ]; then echo "token=$GH" >> "$GITHUB_OUTPUT"; echo "🔑 GH"
          elif [ -n "$GH_PAT" ]; then echo "token=$GH_PAT" >> "$GITHUB_OUTPUT"; echo "🔑 GH_PAT"
          else echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"; echo "🔑 GITHUB_TOKEN"; fi

      - name: Build ephemeral secrets.env
        env:
          # Перечисляем все возможные ключи, чтобы безопасно передать их в скрипт
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CRYPTO_BOT_TOKEN: ${{ secrets.CRYPTO_BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          : > /tmp/secrets.env
          for k in SERPER_API_KEY OPENWEATHER_API_KEY OPENAI_API_KEY \
                   ANTHROPIC_API_KEY GROQ_API_KEY TOGETHER_API_KEY \
                   HF_API_KEY TELEGRAM_BOT_TOKEN CRYPTO_BOT_TOKEN \
                   OPENROUTER_API_KEY; do
            v="${!k}"
            [ -n "$v" ] && echo "$k=$v" >> /tmp/secrets.env
          done
          echo "✅ secrets.env prepared for migration."

      - name: Migrate chats and keys
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          KEYS_FILE: /tmp/secrets.env
        run: |
          FORCE_FLAG=""
          [ "${{ inputs.force }}" = "true" ] && FORCE_FLAG="--force"
          python3 sync_storage.py migrate $FORCE_FLAG --source "${{ inputs.source_repo }}"
          echo "✅ Migration completed to ${STORAGE_REPO}"

      - name: Backup extra files
        if: inputs.with_backup == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: python3 sync_storage.py backup --source "${{ inputs.source_repo }}"

      - name: Sanitize public repo
        if: inputs.sanitize == 'true'
        run: |
          git config user.name "VIBE-CODE Bot"
          git config user.email "vibecode-bot@users.noreply.github.com"
          REMOVED=0

          # Удаляем транскрипты, если они успешно скопированы
          for d in results/run-*; do
            [ -d "$d" ] || continue
            rid=$(basename "$d" | sed 's/^run-//')
            if [ -f "$STORAGE_DIR/chats/chat-run-$rid.json" ] && [ -f "$d/_reasoning.json" ]; then
              git rm -q "$d/_reasoning.json"
              REMOVED=$((REMOVED + 1))
            fi
          done

          # Удаляем файлы с ключами из публичного репо
          for f in secrets.env keys.env .env vibe/secrets.env keys/secrets.env; do
            if [ -f "$f" ]; then git rm -q "$f"; REMOVED=$((REMOVED + 1)); fi
          done

          # Добавляем правила в .gitignore
          touch .gitignore
          for pat in '*.env' 'secrets.env' 'keys/' 'storage/' 'chats/' '.sync.lock'; do
            grep -qxF "$pat" .gitignore || echo "$pat" >> .gitignore
          done
          git add .gitignore

          if git diff --staged --quiet; then
            echo "✅ Sanitize: no sensitive files to remove"
          else
            git commit -m "chore: migrated transcripts and keys to private storage; sanitized public repo"
            git push
            echo "✅ Sanitized: $REMOVED sensitive file(s) removed"
          fi

      - name: Verify storage status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: |
          python3 sync_storage.py status || true

      - name: Cleanup ephemeral secrets
        if: always()
        run: |
          shred -u /tmp/secrets.env 2>/dev/null || rm -f /tmp/secrets.env
          echo "✅ Ephemeral secret file removed"
