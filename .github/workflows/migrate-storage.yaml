name: One-Time Migration → Storage

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Old repo (source of chats)'
        default: 'B3B3097/VIBE-CODE'
      storage_repo:
        description: 'Private storage repo'
        default: 'B3B3097/Storage-VIBE-CODE'
      with_backup:
        description: 'Also backup token_usage.yaml / config.yaml etc.'
        default: 'true'
        type: choice
        options: ['true', 'false']
      force:
        description: 'Re-run migration even if marker exists'
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read   # пуш в storage идёт через sync_storage.py + токен, не через GITHUB_TOKEN

env:
  STORAGE_DIR: /tmp/storage

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout VIBE-CODE
        uses: actions/checkout@v5

      - name: Resolve GitHub token
        id: token
        env:
          GH: ${{ secrets.GH }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH" ]; then echo "token=$GH" >> "$GITHUB_OUTPUT"; echo "🔑 GH"
          elif [ -n "$GH_PAT" ]; then echo "token=$GH_PAT" >> "$GITHUB_OUTPUT"; echo "🔑 GH_PAT"
          else echo "token=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"; echo "🔑 GITHUB_TOKEN"; fi

      # ── Собираем ключи из Actions-секретов во ВРЕМЕННЫЙ файл (раннер эфемерный) ──
      - name: Build ephemeral secrets.env
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          REPLICATE_API_KEY: ${{ secrets.REPLICATE_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          JUDGE0_API_KEY: ${{ secrets.JUDGE0_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          STABILITY_API_KEY: ${{ secrets.STABILITY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WOLFRAM_API_KEY: ${{ secrets.WOLFRAM_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          : > /tmp/secrets.env
          for k in SERPER_API_KEY BRAVE_API_KEY BING_SEARCH_KEY OPENWEATHER_API_KEY \
                   NEWS_API_KEY GNEWS_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY \
                   GROQ_API_KEY TOGETHER_API_KEY HF_API_KEY REPLICATE_API_KEY \
                   COHERE_API_KEY MISTRAL_API_KEY JUDGE0_API_KEY ALPHAVANTAGE_API_KEY \
                   EXCHANGERATE_API_KEY UNSPLASH_API_KEY PEXELS_API_KEY STABILITY_API_KEY \
                   ELEVENLABS_API_KEY TELEGRAM_BOT_TOKEN DISCORD_WEBHOOK_URL \
                   SLACK_WEBHOOK_URL MAILGUN_API_KEY TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN \
                   WOLFRAM_API_KEY DEEPL_API_KEY IPINFO_TOKEN MAPBOX_API_KEY \
                   URLSCAN_API_KEY NOTION_API_KEY AIRTABLE_API_KEY SUPABASE_API_KEY; do
            v="${!k}"
            [ -n "$v" ] && echo "$k=$v" >> /tmp/secrets.env
          done
          echo "✅ secrets.env built: $(wc -l < /tmp/secrets.env) keys (values never printed)"

      # ── Перенос: чаты из results/run-* + ключи → приватный storage ─────────
      - name: Migrate chats + keys
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          KEYS_FILE: /tmp/secrets.env
        run: |
          FORCE=""
          [ "${{ inputs.force }}" = "true" ] && FORCE="--force"
          python3 sync_storage.py migrate $FORCE --source "${{ inputs.source_repo }}"

      # ── Опционально: резервные копии служебных файлов ──────────────────────
      - name: Backup extra files
        if: inputs.with_backup == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: python3 sync_storage.py backup --source "${{ inputs.source_repo }}"

      # ── Итоговая сводка ────────────────────────────────────────────────────
      - name: Verify
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          STORAGE_REPO: ${{ inputs.storage_repo }}
        run: python3 sync_storage.py status

      # ── Зачистка временного файла с ключами ────────────────────────────────
      - name: Cleanup
        if: always()
        run: rm -f /tmp/secrets.env && echo "🧹 ephemeral secrets.env removed"